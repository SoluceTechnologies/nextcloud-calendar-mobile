appId: com.soluce.nextcloudcalendar
---
- runFlow:
    file: ../shared/home-and-wait.yaml
    env: { TITLE: "E2E seed" }
- tapOn:
    id: calendar-mode-day
- assertVisible:
    id: calendar-mode-day
    selected: true
- extendedWaitUntil: { visible: "E2E seed", timeout: 15000 }
- tapOn:
    id: calendar-mode-3days
- extendedWaitUntil: { visible: "E2E seed", timeout: 15000 }
- tapOn:
    id: calendar-mode-week
- extendedWaitUntil: { visible: "E2E seed", timeout: 15000 }
- tapOn:
    id: calendar-mode-month
- extendedWaitUntil:
    visible:
      id: month-day-${TODAY}
      text: ".*events: [1-9].*"
    timeout: 15000
- tapOn:
    id: month-day-${TODAY}
- assertVisible:
    id: calendar-mode-day
    selected: true
- extendedWaitUntil: { visible: "E2E seed", timeout: 15000 }
- tapOn:
    id: calendar-mode-schedule
- extendedWaitUntil: { visible: "E2E seed", timeout: 15000 }
