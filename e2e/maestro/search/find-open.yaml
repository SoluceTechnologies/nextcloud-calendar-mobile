appId: com.soluce.nextcloudcalendar
---
- runFlow:
    file: ../shared/home-and-wait.yaml
    env: { TITLE: "${TITLE}" }
- tapOn:
    id: tab-search
- runFlow:
    file: ../shared/type-text.yaml
    env: { FIELD: search-input, TEXT: "${TITLE}" }
- extendedWaitUntil:
    visible:
      id: result-event-${UID}
    timeout: 15000
- tapOn:
    id: result-event-${UID}
- extendedWaitUntil:
    visible:
      id: event-detail-delete
    timeout: 15000
- assertVisible: ${TITLE}
