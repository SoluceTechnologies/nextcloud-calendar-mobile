appId: com.soluce.nextcloudcalendar
---
- runFlow:
    file: ../shared/home-and-wait.yaml
    env: { TITLE: "E2E seed" }
- tapOn:
    id: calendar-mode-month
- repeat:
    times: 6
    commands:
      - swipe:
          direction: LEFT
          duration: 400
      - waitForAnimationToEnd
- waitForAnimationToEnd
- tapOn:
    id: month-day-${FAR_DAY}
- runFlow:
    when:
      visible:
        id: month-day-${FAR_DAY}
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: month-day-${FAR_DAY}
- assertVisible:
    id: calendar-mode-day
    selected: true
- extendedWaitUntil:
    visible: ${TITLE}
    timeout: 60000
- tapOn:
    id: calendar-today
- extendedWaitUntil:
    visible: "E2E seed"
    timeout: 30000
