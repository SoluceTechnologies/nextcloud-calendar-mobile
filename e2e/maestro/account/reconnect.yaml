appId: com.soluce.nextcloudcalendar
---
- runFlow: ../shared/relaunch.yaml
- runFlow: ../shared/open-settings.yaml
- tapOn:
    id: settings-active-account
- scrollUntilVisible:
    element:
      id: account-reconnect-password
- tapOn:
    id: account-reconnect-password
- inputText: ${NEW_PASS}
# Not hideKeyboard: with no soft keyboard up (hardware-keyboard emulator) it presses Back and
# leaves the app.
- scrollUntilVisible:
    element:
      id: account-reconnect-submit
- tapOn:
    id: account-reconnect-submit
- extendedWaitUntil:
    visible:
      id: account-reconnect-success
    timeout: 30000
- runFlow: ../shared/relaunch.yaml
- extendedWaitUntil:
    visible: ${AFTER_TITLE}
    timeout: 60000
- assertVisible: ${BEFORE_TITLE}
