appId: com.soluce.nextcloudcalendar
---
- runFlow: ../shared/ensure-home.yaml
- runFlow: ../shared/open-settings.yaml
- tapOn:
    id: settings-active-account
- scrollUntilVisible:
    element:
      id: account-delete
- tapOn:
    id: account-delete
- tapOn: "Remove"
- extendedWaitUntil:
    visible:
      id: setup-server-url
    timeout: 30000
