appId: com.soluce.nextcloudcalendar
---
- runFlow: ../shared/ensure-home.yaml
- tapOn:
    id: calendar-fab-new
- extendedWaitUntil:
    visible:
      id: event-form-title
    timeout: 15000
- runFlow:
    file: ../shared/type-text.yaml
    env: { FIELD: event-form-title, TEXT: "${TITLE}" }
- tapOn:
    id: event-form-all-day
- scrollUntilVisible:
    element:
      id: event-form-attendee-input
- tapOn:
    id: event-form-attendee-input
- inputText: ${ATTENDEE}
- tapOn:
    id: event-form-attendee-add
- scrollUntilVisible:
    element:
      id: event-form-save
- tapOn:
    id: event-form-save
- runFlow: ../shared/open-event.yaml
- scrollUntilVisible:
    element: ${ATTENDEE}
