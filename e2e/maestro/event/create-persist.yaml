appId: com.soluce.nextcloudcalendar
name: event-create-persist
---
- runFlow: ../shared/ensure-home.yaml
- tapOn:
    id: calendar-fab-new
- extendedWaitUntil:
    visible:
      id: event-form-title
    timeout: 15000
- tapOn:
    id: event-form-title
- inputText: ${TITLE}
- tapOn:
    id: event-form-all-day
- scrollUntilVisible:
    element:
      id: event-form-save
- tapOn:
    id: event-form-save
- extendedWaitUntil:
    visible: ${TITLE}
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ${TITLE}
    timeout: 30000
