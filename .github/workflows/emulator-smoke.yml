name: Emulator smoke

# Boots the dev-client APK on a hardware-accelerated Android emulator and
# renders the app from Metro — proves the build, native modules and JS bundle
# work on a real Android runtime. Screenshots land in the run artifacts.

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
      - 'assets/screenshots/**'
      - '.devin/**'

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Boot app on API 35 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must run BEFORE setup-java/setup-node: this deletes $AGENT_TOOLSDIRECTORY,
      # which is where those actions install the JDK/Node they then rely on.
      - name: Free disk space (~10 GB of unused toolchains)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet "$AGENT_TOOLSDIRECTORY" /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      # Manages the dependency cache + Gradle build cache across runs — much
      # faster incremental builds than a raw actions/cache on ~/.gradle.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Generate android project (prebuild)
        run: EXPO_NO_GIT_STATUS=1 yarn expo prebuild --platform android --clean --no-install

      # Build BEFORE the emulator: the APK compile shouldn't compete with an
      # already-booted emulator for the 4 runner cores. --build-cache lets
      # setup-gradle restore task outputs across runs (the RN template doesn't
      # enable org.gradle.caching), turning rebuilds into near-instant restores.
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --build-cache

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # android-emulator-runner shells out to `sdkmanager`, which lives in
      # cmdline-tools on ubuntu-24.04 but isn't on PATH by default.
      - name: Put sdkmanager on PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # Sanity: surface silent sdkmanager failures early (needs JAVA_HOME).
          java -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      # Snapshot of a fully-booted AVD: skips AVD creation AND cold boot on
      # cache hit (~2-3 min). The snapshot is generated by the step below on
      # first run; -no-snapshot-save keeps it pristine afterwards.
      - name: AVD snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api35-x86_64-pixel-v2

      - name: Generate AVD snapshot (first run only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -netdelay none -netspeed full
          script: "true"

      - name: Boot emulator and render app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -netdelay none -netspeed full
          script: |
            set -e
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 3; done
            adb shell wm dismiss-keyguard || true

            adb install -r android/app/build/outputs/apk/debug/app-debug.apk

            nohup yarn expo start --dev-client --port 8081 > metro.log 2>&1 &
            for i in $(seq 60); do curl -sf http://localhost:8081/status | grep -q running && break; sleep 2; done
            adb reverse tcp:8081 tcp:8081

            adb shell am start -a android.intent.action.VIEW -d "nextcloud-calendar://expo-development-client/?url=http://localhost:8081"

            # Wait for Metro bundling + JS evaluation + first render.
            sleep 150
            adb shell input keyevent 4 || true   # dismiss the dev-client welcome sheet
            sleep 3
            adb shell monkey -p com.soluce.nextcloudcalendar -c android.intent.category.LAUNCHER 1 || true
            sleep 5
            adb exec-out screencap -p > smoke-app.png
            adb logcat -d -s ReactNativeJS:V > js.log || true

            # E2E #377: real Nextcloud in Docker + Maestro flows driven directly
            # (no clearState — the dev client must keep its Metro URL).
            docker run -d --name nc-e2e -p 80 -e SQLITE_DATABASE=nextcloud -e NEXTCLOUD_ADMIN_USER=e2e -e NEXTCLOUD_ADMIN_PASSWORD='Ncm-E2e-Passw0rd-2026' -e NEXTCLOUD_TRUSTED_DOMAINS='localhost 10.0.2.2' nextcloud:34-apache > nc-docker.log 2>&1
            # Each script line is a separate `sh -c`: the port must live on disk.
            docker port nc-e2e 80 | head -1 | sed 's/.*://' > nc-port.txt
            for i in $(seq 140); do curl -sf "http://localhost:$(cat nc-port.txt)/status.php" | grep -q '"installed":true' && break; sleep 3; done
            curl -sf "http://localhost:$(cat nc-port.txt)/status.php" | grep -q '"installed":true' || { docker logs nc-e2e >> nc-docker.log 2>&1; echo "Nextcloud never became ready (port=$(cat nc-port.txt))"; exit 1; }
            docker exec -u www-data -w /var/www/html nc-e2e php occ app:install calendar >> nc-docker.log 2>&1 || true
            docker exec -u www-data -w /var/www/html nc-e2e php occ config:system:set auth.bruteforce.protection.enabled --type=boolean --value=false >> nc-docker.log 2>&1 || true

            curl -fsSL https://get.maestro.mobile.dev | bash > maestro-install.log 2>&1
            $HOME/.maestro/bin/maestro test e2e/maestro/shared/login.yaml -e NC_URL="http://10.0.2.2:$(cat nc-port.txt)" -e NC_USER=e2e -e NC_PASS='Ncm-E2e-Passw0rd-2026' || { adb exec-out screencap -p > smoke-login-fail.png || true; exit 1; }
            $HOME/.maestro/bin/maestro test e2e/maestro/event/transp-status.yaml -e TITLE='E2E ts smoke' -e TRANSP=transparent -e STATUS=tentative || { adb exec-out screencap -p > smoke-e2e-fail.png || true; exit 1; }
            $HOME/.maestro/bin/maestro test e2e/maestro/event/status-edit.yaml -e TITLE='E2E ts smoke' -e STATUS=cancelled || { adb exec-out screencap -p > smoke-e2e-fail.png || true; exit 1; }
            adb exec-out screencap -p > smoke-e2e.png || true

            # The app's CalDAV write is async — poll every calendar's export until it lands.
            for i in $(seq 30); do ICS=""; for cal in $(curl -su e2e:'Ncm-E2e-Passw0rd-2026' -X PROPFIND -H 'Depth: 1' "http://localhost:$(cat nc-port.txt)/remote.php/dav/calendars/e2e/" | grep -o 'calendars/e2e/[^<]*/' | sed 's|calendars/e2e/||;s|/$||' | sort -u); do ICS="$ICS$(curl -su e2e:'Ncm-E2e-Passw0rd-2026' "http://localhost:$(cat nc-port.txt)/remote.php/dav/calendars/e2e/$cal/?export")"; done; if echo "$ICS" | grep -q 'STATUS:CANCELLED' && echo "$ICS" | grep -q 'TRANSP:TRANSPARENT'; then echo "$ICS" > server-ics.txt; break; fi; sleep 4; done
            grep -q 'STATUS:CANCELLED' server-ics.txt || { echo "STATUS:CANCELLED missing from server ICS"; tail -30 server-ics.txt; exit 1; }
            grep -q 'TRANSP:TRANSPARENT' server-ics.txt || { echo "TRANSP:TRANSPARENT missing from server ICS"; tail -30 server-ics.txt; exit 1; }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-${{ github.run_number }}
          path: |
            smoke-*.png
            js.log
            metro.log
            nc-docker.log
            maestro-install.log
          retention-days: 30
