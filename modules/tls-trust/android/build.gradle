plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tlstrust'
version = '0.1.0'

android {
  namespace "expo.modules.tlstrust"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // React Native already bundles OkHttp; pin the same major to compile against.
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
